name: Visualizador SIMLOG v2.1 / v2.2 / v2.3 · pruebas

on:
  push:
    branches: [feature/visualizador-simlog-v23]
  workflow_dispatch:

jobs:
  viewer-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencias de visualizador
        run: python -m pip install -r requirements.txt
      - name: Comprobar scripts
        run: |
          bash -n iniciar_visualizador_simlog_v21.sh
          bash -n visualizar_simlog_v22.sh
          python -m compileall -q laboratorio/simlog_viewer_v21.py laboratorio/importar_simlog_v22.py laboratorio/actualizar_simlog_actions_v23.py laboratorio/pages tests
      - name: Compatibilidad del visualizador v2.1
        run: python -m unittest discover -s tests -p 'test_visualizador_simlog_v21.py' -v
      - name: Importación y visualización de SIMLOG v2.2
        run: python -m unittest discover -s tests -p 'test_visualizador_simlog_v22.py' -v
      - name: Regresión narrativa por ronda
        run: python -m unittest discover -s tests -p 'test_narrativa_simlog_v21.py' -v
      - name: Regresión paneles de ronda
        run: python -m unittest discover -s tests -p 'test_paneles_ronda_v21.py' -v
      - name: Tablero de posiciones y cobertura
        run: python -m unittest discover -s tests -p 'test_tablero_simlog_v23.py' -v
      - name: Importador de GitHub Actions SIMLOG v2.3 (sin red)
        run: python -m unittest discover -s tests -p 'test_actualizar_simlog_actions_v23.py' -v
      - name: Preparar navegador para inspección visual
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install playwright
          google-chrome --version
      - name: "Inspeccionar pantalla real: ronda y tablero"
        if: matrix.python-version == '3.11'
        run: python tests/smoke_visualizador_inspector.py
      - name: Capturas del visualizador
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: inspector-simlog-capturas
          path: test-results/simlog-inspector/
          if-no-files-found: ignore
