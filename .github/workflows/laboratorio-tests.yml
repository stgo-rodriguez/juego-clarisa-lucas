name: Laboratorio de Balance - Pruebas
on:
  push:
    branches: [feature/laboratorio-balance]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: laboratorio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Instalar dependencias de la interfaz
        run: python -m pip install -r requirements.txt
      - name: Comprobar sintaxis y entorno local
        run: |
          python -m compileall -q laboratorio simulador tests
          python -m laboratorio.diagnostico --json
      - name: Suite de reglas, economía e interfaz Streamlit
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: CSV de referencia y semillas
        run: python -m laboratorio.verificar_baseline
      - name: Regresión completa de 2.000 partidas
        if: matrix.python-version == '3.11'
        run: python -m laboratorio.verificar_baseline --full
