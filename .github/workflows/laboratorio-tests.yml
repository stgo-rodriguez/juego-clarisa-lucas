name: Laboratorio de Balance - Pruebas
on:
  push:
    branches: [feature/laboratorio-balance]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar dependencias de la interfaz
        run: python -m pip install -r requirements.txt
      - name: Suite de reglas, economía e interfaz Streamlit
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: CSV de referencia y semillas
        run: python -m laboratorio.verificar_baseline
      - name: Regresión completa de 2.000 partidas
        run: python -m laboratorio.verificar_baseline --full
