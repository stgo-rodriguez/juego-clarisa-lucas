name: Comparativa v2.2 · cinco políticas, manos 3 y 4, banco 2:1

on:
  push:
    branches: [feature/v22-auditoria-politicas-banco]
    paths: ['.github/workflows/v22-comparar-estrategias.yml']
  workflow_dispatch:

jobs:
  comparar:
    name: "${{ matrix.nombre }} · ${{ matrix.jugadores }} jugadores"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {nombre: A_planificador_mano3, politica: planificador, mano: 3, jugadores: 6}
          - {nombre: A_planificador_mano3, politica: planificador, mano: 3, jugadores: 10}
          - {nombre: B_mixto_mano3, politica: mixto, mano: 3, jugadores: 6}
          - {nombre: B_mixto_mano3, politica: mixto, mano: 3, jugadores: 10}
          - {nombre: C_aleatorio_mano3, politica: aleatorio, mano: 3, jugadores: 6}
          - {nombre: C_aleatorio_mano3, politica: aleatorio, mano: 3, jugadores: 10}
          - {nombre: D_mixto_mano4, politica: mixto, mano: 4, jugadores: 6}
          - {nombre: D_mixto_mano4, politica: mixto, mano: 4, jugadores: 10}
          - {nombre: E_planificador_mano4, politica: planificador, mano: 4, jugadores: 6}
          - {nombre: E_planificador_mano4, politica: planificador, mano: 4, jugadores: 10}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ejecutar 40 partidas controladas para este escenario
        env:
          POLITICA: ${{ matrix.politica }}
          MANO: ${{ matrix.mano }}
          JUGADORES: ${{ matrix.jugadores }}
          NOMBRE: ${{ matrix.nombre }}
        run: |
          python -m laboratorio.simular_versionado \
            --version 2.2 --politica "$POLITICA" --mano "$MANO" \
            --jugadores "$JUGADORES" --semillas 40 --inicio 3201 \
            --rondas 100 --out "resultados/experimentos/$NOMBRE/${JUGADORES}j"
      - name: Auditar economía por fuentes y guardar resultados por escenario
        env:
          JUGADORES: ${{ matrix.jugadores }}
          NOMBRE: ${{ matrix.nombre }}
        run: |
          python -m laboratorio.analizar_simlog_v21_revision \
            --out "resultados/experimentos/$NOMBRE/${JUGADORES}j" \
            > "resultados/experimentos/$NOMBRE/${JUGADORES}j/analisis_detalle.log"
          python -m laboratorio.analizar_experimentos_politicas_v22 \
            --out "resultados/experimentos/$NOMBRE/${JUGADORES}j"
      - name: Publicar resultados tabulares sin archivos de trazas masivas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "SIMLOG_v22_comparativa_${{ matrix.nombre }}_${{ matrix.jugadores }}j"
          path: |
            resultados/experimentos/${{ matrix.nombre }}/${{ matrix.jugadores }}j/resumen_experimento.json
            resultados/experimentos/${{ matrix.nombre }}/${{ matrix.jugadores }}j/resumen_experimento.csv
            resultados/experimentos/${{ matrix.nombre }}/${{ matrix.jugadores }}j/partidas.csv
            resultados/experimentos/${{ matrix.nombre }}/${{ matrix.jugadores }}j/diversidad_decisiones_por_grupo.csv
            resultados/experimentos/${{ matrix.nombre }}/${{ matrix.jugadores }}j/balance_por_etapa.csv
            resultados/experimentos/${{ matrix.nombre }}/${{ matrix.jugadores }}j/balance_por_mecanismo.csv
            resultados/experimentos/${{ matrix.nombre }}/${{ matrix.jugadores }}j/primera_ronda_por_mesa.csv
            resultados/experimentos/${{ matrix.nombre }}/${{ matrix.jugadores }}j/duracion_por_mesa.csv
          if-no-files-found: warn
          retention-days: 30
