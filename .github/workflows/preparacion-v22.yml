name: Preparación de simulador v2.2 (motor v2.1 aislado)

on:
  push:
    branches:
      - feature/simulador-v22
  pull_request:
    branches:
      - fix/simlog-v21-especificacion-20261108

jobs:
  version-isolation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Revisar sintaxis
        run: python -m compileall -q simulador laboratorio tests
      - name: Probar aislamiento y bloqueo v2.2
        run: python -m unittest discover -s tests -p 'test_versiones_v22.py' -v
      - name: Motor v2.1 sigue pasando sus pruebas
        run: python -m unittest discover -s tests -p 'test_reglas_simlog_v21.py' -v
      - name: Smoke de dos partidas identificadas v2.1
        run: python -m laboratorio.simular_versionado --version 2.1 --semillas 1 --rondas 35 --out resultados/simlog_v21_preparacion
