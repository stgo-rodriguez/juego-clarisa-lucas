name: Laboratorio de Balance v3.0 · modelo y optimización

on:
  push:
    branches: [feature/visualizador-simlog-v23]
    paths:
      - 'laboratorio/v3/**'
      - 'tests/test_matriz_economica_v3.py'
      - 'tests/test_modelo_matematico_v3.py'
      - 'tests/test_optimizador_economico_v3.py'
      - '.github/workflows/laboratorio-balance-v3.yml'
  workflow_dispatch:

jobs:
  validar-economia-y-optimizacion:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compilar módulo económico v3.0
        run: python -m compileall -q laboratorio/v3/
      - name: Auditar esquema y valores abiertos
        run: python -m laboratorio.v3.catalogo --validar
      - name: Ejecutar pruebas de matriz
        run: python -m unittest discover -s tests -p 'test_matriz_economica_v3.py' -v
      - name: Verificar modelo matemático, rutas y escenarios
        run: python -m unittest discover -s tests -p 'test_modelo_matematico_v3.py' -v
      - name: Ejecutar escenario didáctico v3.0 reproducible
        run: python -m laboratorio.v3.ejecutar_modelo --salida /tmp/salida_modelo_v3.json
      - name: Probar optimización conjunta de premios y costos
        run: python -m unittest discover -s tests -p 'test_optimizador_economico_v3.py' -v
      - name: Optimizar escenario didáctico y verificar salida
        run: python -m laboratorio.v3.optimizar --max-evaluaciones 1500 --salida /tmp/optimizacion_v3.json
      - name: Resumir combinación de prueba y frontera Pareto
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          obj = json.loads(Path("/tmp/optimizacion_v3.json").read_text())
          best = obj["mejor_por_pesos"]
          summary = [
              "## Optimización económica v3.0 — DEMOSTRACIÓN NO CALIBRADA",
              "",
              "**Importes y frecuencias sintéticos: NO son reglas recomendadas.**",
              "",
              f"- Búsqueda: {obj['metodo']}",
              f"- Combinaciones: {obj['combinaciones_evaluadas']} / {obj['espacio_combinaciones']}",
              f"- Tamaño frontera Pareto: {obj['frontera_pareto_total']}",
              f"- Puntaje ponderado (ejemplo): {best['puntaje_ponderado']:.5f}",
              "",
              "| Parámetro | Cantidad de ejemplo |",
              "|---|---:|",
          ]
          for item in obj["variables"]:
              p = item["parametro"]
              summary.append(f"| `{p}` | {best['ajustes'][p]} |")
          summary.extend([
              "",
              "Estos números son válidos exclusivamente bajo las hipótesis "
              "del escenario de prueba. No se han simulado partidas v3.0."
          ])
          print(chr(10).join(summary))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(chr(10).join(summary) + chr(10))
          PY
      - name: Guardar salida experimental para inspección
        uses: actions/upload-artifact@v4
        with:
          name: optimizacion-v3-demostracion-py${{ matrix.python-version }}
          path: /tmp/optimizacion_v3.json
          retention-days: 30
