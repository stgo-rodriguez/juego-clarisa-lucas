name: Visualizador SIMLOG v2.1 · validación

on:
  push:
    branches: [feature/visualizador-simlog-v21]
  pull_request:
    branches: [fix/simlog-v21-especificacion-20261108]
  workflow_dispatch:

jobs:
  viewer-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias de UI
        run: python -m pip install -r requirements.txt
      - name: Verificar sintaxis del lanzador único
        run: bash -n iniciar_visualizador_simlog_v21.sh
      - name: Compilar visualizador y pruebas
        run: python -m compileall -q laboratorio/simlog_viewer_v21.py laboratorio/narrativa_simlog_v21.py laboratorio/pages tests/test_visualizador_simlog_v21.py tests/test_narrativa_simlog_v21.py
      - name: Pruebas de esquemas, ganadores y eventos
        run: python -m unittest discover -s tests -p test_visualizador_simlog_v21.py -v
      - name: Pruebas de narración por jugador y ronda
        run: python -m unittest discover -s tests -p test_narrativa_simlog_v21.py -v
      - name: Regresión de compatibilidad SIMLOG v2.1
        run: python -m unittest discover -s tests -p test_reglas_simlog_v21.py -v
