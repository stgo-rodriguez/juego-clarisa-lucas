name: Simulaciones v2 - SIMLOG v2.1 y mazos vigentes
on:
  push:
    branches:
      - feature/simulaciones-v2-movimiento
    paths:
      - 'simulador/movimiento_v2.py'
      - 'simulador/turnos_v2.py'
      - 'simulador/economia_v2.py'
      - 'simulador/transiciones_v2.py'
      - 'simulador/agentes_v2.py'
      - 'simulador/interacciones_v2.py'
      - 'simulador/competencia_v2.py'
      - 'laboratorio/sensibilidad_v2.py'
      - 'laboratorio/consolidar_sensibilidad_v2.py'
      - 'tests/test_sensibilidad_v2.py'
      - 'tests/test_fase9_v2.py'
      - 'laboratorio/factorial_v2.py'
      - 'laboratorio/rupturas_v2.py'
      - 'simulador/mazos_propuestos_v2.py'
      - 'laboratorio/experimento_mazos_propuestos_v2.py'
      - 'laboratorio/auditoria_mazos_propuestos_v2.py'
      - 'tests/test_mazos_propuestos_v2.py'
      - 'docs/datos_fase10/catalogo_fuentes_situaciones_v2.json'
      - 'laboratorio/calibracion_cartas_v2.py'
      - 'laboratorio/consolidar_calibracion_v2.py'
      - 'tests/test_calibracion_v2.py'
      - 'simulador/simlog_v2.py'
      - 'laboratorio/ejecutar_simlog_v2.py'
      - 'laboratorio/crear_muestra_simlog_xlsx.py'
      - 'tests/test_simlog_v2.py'
      - 'simulador/afinidad_v2.py'
      - 'simulador/mazos_vigentes_v2.py'
      - 'laboratorio/simular_mazos_vigentes_v2.py'
      - 'laboratorio/analizar_corrida_v21.py'
      - 'tests/test_cartas_vigentes_v21.py'
      - 'build_new_cards.py'
      - 'docs/datos_v2_nuevas_cartas/**'
      - 'tests/test_movimiento_v2.py'
      - 'tests/test_turnos_v2.py'
      - 'tests/test_economia_v2.py'
      - 'tests/test_transiciones_v2.py'
      - 'tests/test_agentes_v2.py'
      - 'tests/test_interacciones_v2.py'
      - 'tests/test_competencia_v2.py'
      - 'laboratorio/smoke_turnos_v2.py'
      - 'laboratorio/smoke_economia_v2.py'
      - 'laboratorio/smoke_transiciones_v2.py'
      - 'laboratorio/comparar_dublin_v2.py'
      - 'laboratorio/experimento_agentes_v2.py'
      - 'laboratorio/experimento_interacciones_v2.py'
      - 'laboratorio/experimento_competencia_v2.py'
      - '.github/workflows/simulaciones-v2.yml'
  workflow_dispatch:

jobs:
  movimiento-y-turnos-v2:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sintaxis del motor y pruebas v2
        run: python -m compileall -q simulador/movimiento_v2.py simulador/turnos_v2.py tests/test_movimiento_v2.py tests/test_turnos_v2.py tests/test_economia_v2.py simulador/economia_v2.py simulador/transiciones_v2.py tests/test_transiciones_v2.py laboratorio/smoke_transiciones_v2.py laboratorio/comparar_dublin_v2.py simulador/agentes_v2.py laboratorio/experimento_agentes_v2.py tests/test_agentes_v2.py simulador/interacciones_v2.py laboratorio/experimento_interacciones_v2.py tests/test_interacciones_v2.py simulador/competencia_v2.py laboratorio/experimento_competencia_v2.py tests/test_competencia_v2.py laboratorio/sensibilidad_v2.py laboratorio/consolidar_sensibilidad_v2.py tests/test_sensibilidad_v2.py tests/test_fase9_v2.py laboratorio/factorial_v2.py laboratorio/rupturas_v2.py simulador/mazos_propuestos_v2.py laboratorio/experimento_mazos_propuestos_v2.py laboratorio/auditoria_mazos_propuestos_v2.py tests/test_mazos_propuestos_v2.py laboratorio/calibracion_cartas_v2.py laboratorio/consolidar_calibracion_v2.py tests/test_calibracion_v2.py simulador/simlog_v2.py laboratorio/ejecutar_simlog_v2.py laboratorio/crear_muestra_simlog_xlsx.py tests/test_simlog_v2.py simulador/afinidad_v2.py simulador/mazos_vigentes_v2.py laboratorio/simular_mazos_vigentes_v2.py laboratorio/analizar_corrida_v21.py tests/test_cartas_vigentes_v21.py build_new_cards.py
      - name: Pruebas geométricas v2
        run: python -m unittest discover -s tests -p 'test_movimiento_v2.py' -v
      - name: Pruebas de orquestador v2
        run: python -m unittest discover -s tests -p 'test_turnos_v2.py' -v
      - name: Integración 6 y 10 jugadores sin efectos económicos
        run: python -m laboratorio.smoke_turnos_v2 --rondas 2
      - name: Pruebas de contabilidad y reglas económicas v2
        run: python -m unittest discover -s tests -p 'test_economia_v2.py' -v
      - name: Integración de economía sin Situaciones aprobadas
        run: python -m laboratorio.smoke_economia_v2 --rondas 4
      - name: Pruebas UTN, Perfil y Dublín (Fase 4)
        run: python -m unittest discover -s tests -p 'test_transiciones_v2.py' -v
      - name: Integración de 6 y 10 en ambas políticas de Dublín
        run: python -m laboratorio.smoke_transiciones_v2 --dublin-policy both
      - name: Comparación contrafactual con 50 semillas
        run: python -m laboratorio.comparar_dublin_v2 --semillas 50 --out resultados/fase4
      - name: Pruebas de agente, mercado y corrección del RNG (Fase 5)
        run: python -m unittest discover -s tests -p 'test_agentes_v2.py' -v
      - name: Integración de partidas sintéticas de 6 y 10 jugadores
        run: python -m laboratorio.experimento_agentes_v2 --semillas 5 --rondas 60 --mano 3 --out resultados/fase5_ci
      - name: Duelo, Perfil, hito y subastas de una ronda (Fase 6)
        run: python -m unittest discover -s tests -p 'test_interacciones_v2.py' -v
      - name: Simular 20 semillas de subastas sintéticas de 6 y 10 jugadores
        run: python -m laboratorio.experimento_interacciones_v2 --semillas 20 --out resultados/fase6_ci
      - name: Bots con intervenciones y duelos integrados (Fase 7)
        run: python -m unittest discover -s tests -p 'test_competencia_v2.py' -v
      - name: Comparación apareada con y sin competencia (humo Fase 7)
        run: python -m laboratorio.experimento_competencia_v2 --semillas 5 --rondas 60 --mano 3 --out resultados/fase7_ci
      - name: Sensibilidad económica, regresión de fuentes de Perfil (Fase 8)
        run: python -m unittest discover -s tests -p 'test_sensibilidad_v2.py' -v
      - name: Comparar escenarios pareados (smoke 2 semillas, ambas políticas)
        run: python -m laboratorio.sensibilidad_v2 --semillas 2 --rondas 100 --ambos-agentes --out resultados/fase8_ci
      - name: Factorial 2^3 y rupturas juveniles (Fase 9)
        run: python -m unittest discover -s tests -p 'test_fase9_v2.py' -v
      - name: Smoke factorial 2 semillas x 2 mesas x 2 agentes x competencia
        run: python -m laboratorio.factorial_v2 --semillas 2 --rondas 60 --out resultados/fase9_factorial_ci
      - name: Smoke reservas juveniles con ayuda y ruptura
        run: python -m laboratorio.rupturas_v2 --semillas 2 --rondas 60 --out resultados/fase9_reservas_ci
      - name: Validar catálogo histórico 78 y propuestas adultas 30 (Fase 10)
        run: python -m unittest discover -s tests -p 'test_mazos_propuestos_v2.py' -v
      - name: Auditoría de seis mazos propuestos sin aprobar
        run: python -m laboratorio.auditoria_mazos_propuestos_v2 --out resultados/fase10_auditoria_ci
      - name: Comparación con mazos sintéticos en dos semillas
        run: python -m laboratorio.experimento_mazos_propuestos_v2 --semillas 2 --rondas 75 --out resultados/fase10_ci
      - name: Validar calibración de premios y pérdidas por carta (Fase 11)
        run: python -m unittest discover -s tests -p 'test_calibracion_v2.py' -v
      - name: Smoke factorial con cartas documentadas (16 partidas)
        run: python -m laboratorio.calibracion_cartas_v2 --semillas 1 --rondas 80 --solo-planificador --solo-competencia --out resultados/fase11_ci
      - name: SIMLOG v2 - traza de turnos y sin cambios a resultados
        run: python -m unittest discover -s tests -p 'test_simlog_v2.py' -v
      - name: SIMLOG v2 - exportación reproducible de una partida
        run: python -m laboratorio.ejecutar_simlog_v2 --semillas 1 --rondas 40 --mesas 6 --agentes planificador --competencia si --escenario original --out resultados/simlog_v2_ci
      - name: SIMLOG v2.1 - validar cartas, barajado, afinidad y reversión
        run: python -m unittest discover -s tests -p 'test_cartas_vigentes_v21.py' -v
      - name: SIMLOG v2.1 - catálogo estable de 102 cartas
        run: python build_new_cards.py
      - name: SIMLOG v2.1 - simulación de seis y diez con trazas
        run: python -m laboratorio.simular_mazos_vigentes_v2 --semillas 1 --rondas 40 --out resultados/simlog_v21_ci
